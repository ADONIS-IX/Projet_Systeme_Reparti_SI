---
# roles/deploy/tasks/main.yml — Déploiement de l'application sur Kubernetes
# Les variables db_password et django_secret_key sont définies dans playbook.yml

# ── Démarrer Minikube ────────────────────────────────────────────────────────
- name: Démarrer Minikube (driver Docker)
  shell: sg docker -c 'minikube start --driver=docker'
  become_user: "{{ ansible_user | default('root') }}"
  register: _minikube_start
  changed_when: "'Done' in _minikube_start.stdout"

- name: Configurer kubectl pour utiliser le contexte Minikube
  shell: kubectl config use-context minikube
  become_user: "{{ ansible_user | default('root') }}"
  register: _kubectl_context
  changed_when: "'Switched' in _kubectl_context.stdout"
  failed_when: false

# ── Copier les manifests ────────────────────────────────────────────────────
- name: Copier les manifests Kubernetes
  copy:
    src: "{{ playbook_dir }}/../k8s/"
    dest: /tmp/k8s-manifests/
    mode: '0644'

# ── Copier le code applicatif sur la VM (incrémental) ───────────────────────
- name: Créer le répertoire source distant
  file:
    path: /tmp/app-src
    state: directory
    mode: '0755'

- name: Copier le code backend sur la VM
  copy:
    src: "{{ playbook_dir }}/../backend/"
    dest: /tmp/app-src/backend/

- name: Copier le code frontend sur la VM
  copy:
    src: "{{ playbook_dir }}/../frontend/"
    dest: /tmp/app-src/frontend/

# ── Construire les images Docker ─────────────────────────────────────────────
- name: Construire l'image backend dans Minikube
  shell: sg docker -c 'minikube image build -t adonisdocker/backend:latest /tmp/app-src/backend'
  become_user: "{{ ansible_user | default('root') }}"

- name: Construire l'image frontend
  shell: >
    sg docker -c 'minikube image build
    --build-opt build-arg=REACT_APP_API_URL=/api
    -t adonisdocker/frontend:latest /tmp/app-src/frontend'
  become_user: "{{ ansible_user | default('root') }}"

- name: Nettoyer le répertoire source distant après build
  file:
    path: /tmp/app-src
    state: absent

- name: Vérifier l'accès au cluster Kubernetes
  command: kubectl cluster-info
  become_user: "{{ ansible_user | default('root') }}"
  changed_when: false

# ── Créer les Secrets Kubernetes ─────────────────────────────────────────────
- name: Appliquer le manifest des secrets
  command: kubectl apply -f /tmp/k8s-manifests/secrets.yaml
  become_user: "{{ ansible_user | default('root') }}"
  register: _apply_secrets
  changed_when: "'unchanged' not in _apply_secrets.stdout"

# ── Déployer PostgreSQL ───────────────────────────────────────────────────────
- name: Appliquer le PVC PostgreSQL
  command: kubectl apply -f /tmp/k8s-manifests/postgres-pvc.yaml
  become_user: "{{ ansible_user | default('root') }}"
  register: _apply_pg_pvc
  changed_when: "'unchanged' not in _apply_pg_pvc.stdout"

- name: Déployer PostgreSQL
  command: kubectl apply -f /tmp/k8s-manifests/postgres-deployment.yaml
  become_user: "{{ ansible_user | default('root') }}"
  register: _apply_pg
  changed_when: "'unchanged' not in _apply_pg.stdout"

- name: Attendre que PostgreSQL soit prêt
  command: kubectl wait --for=condition=Ready pod -l app=postgres --timeout=120s
  become_user: "{{ ansible_user | default('root') }}"
  changed_when: false

# ── Déployer Backend ──────────────────────────────────────────────────────────
- name: Déployer le Backend Django
  command: kubectl apply -f /tmp/k8s-manifests/backend-deployment.yaml
  become_user: "{{ ansible_user | default('root') }}"
  register: _apply_backend
  changed_when: "'unchanged' not in _apply_backend.stdout"

- name: Attendre que le Backend soit prêt
  command: kubectl wait --for=condition=Ready pod -l app=backend --timeout=300s
  become_user: "{{ ansible_user | default('root') }}"
  changed_when: false

# ── Déployer Frontend ─────────────────────────────────────────────────────────
- name: Déployer le Frontend React
  command: kubectl apply -f /tmp/k8s-manifests/frontend-deployment.yaml
  become_user: "{{ ansible_user | default('root') }}"
  register: _apply_frontend
  changed_when: "'unchanged' not in _apply_frontend.stdout"

- name: Attendre que le Frontend soit prêt
  command: kubectl wait --for=condition=Ready pod -l app=frontend --timeout=120s
  become_user: "{{ ansible_user | default('root') }}"
  changed_when: false

# ── URLs d'accès ──────────────────────────────────────────────────────────────
- name: Récupérer l'IP Minikube
  shell: sg docker -c 'minikube ip'
  register: _minikube_ip
  become_user: "{{ ansible_user | default('root') }}"
  changed_when: false

- name: Afficher les URLs d'accès
  debug:
    msg:
      - "✅ Application déployée avec succès !"
      - "🌐 Frontend  → http://{{ _minikube_ip.stdout }}:30080"
      - "🔌 Backend   → http://{{ _minikube_ip.stdout }}:30800/api"
